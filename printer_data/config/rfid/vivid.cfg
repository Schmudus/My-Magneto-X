[rfid mfrc522_0]
spi_bus: spi2_PB2_PB11_PB10
cs_pin: Vivid_1:RFID0_CS
spi_speed: 100000
lanes: 1,2
messages: True
debug: False
scan_tries: 6
scan_delay: 0.05
driver: auto
scan_window: 10.0 # How long (in seconds) the reader keeps scanning while the spool is spinning during a load sequence. Increase if your spool takes longer to rotate past the reader. Minimum: 1.0
max_pages: 135 #   NTAG213: 41 NTAG215: 131 NTAG216: 227 #Minimum: 4


[rfid mfrc522_1]
spi_bus: spi2_PB2_PB11_PB10
cs_pin: Vivid_1:RFID1_CS
spi_speed: 100000
lanes: 3,4
messages: True
debug: False
scan_tries: 6
scan_delay: 0.05
driver: auto
scan_window: 10.0 # How long (in seconds) the reader keeps scanning while the spool is spinning during a load sequence. Increase if your spool takes longer to rotate past the reader. Minimum: 1.0
max_pages: 135 #   NTAG213: 41 NTAG215: 131 NTAG216: 227 #Minimum: 4

